[workspace]
members = [
    "crates/cardex-core",
    "crates/cardex-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tantivy = "0.26.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.44"
